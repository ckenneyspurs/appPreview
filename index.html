<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App 1.0 Showcase</title>
<meta name="theme-color" content="#050506">
<style>
  :root {
    --bg: #050506;
    --panel: #0d0e11;
    --panel-2: #14161a;
    --line: #2a2d33;
    --silver: #c9ced6;
    --silver-hi: #f4f6f9;
    --silver-lo: #7d838d;
    --accent: #e8ecf2;
    --glow: rgba(210, 218, 230, 0.18);
    --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body {
    background: var(--bg);
    color: var(--silver);
    font-family: var(--font);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(160,170,185,0.10), transparent 55%),
      radial-gradient(ellipse at 90% 40%, rgba(120,130,145,0.07), transparent 50%),
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: auto, auto, 48px 48px, 48px 48px;
  }

  /* NAV */
  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px clamp(16px, 4vw, 48px);
    background: rgba(5,5,6,0.82);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-family: var(--mono); font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--silver-hi); white-space: nowrap; }
  .nav-links { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-links a {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--silver-lo); text-decoration: none; padding: 8px 12px; border: 1px solid transparent;
    border-radius: 2px; white-space: nowrap; transition: all .2s;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--silver-hi); border-color: var(--line); background: var(--panel); }

  /* HERO */
  .hero { padding: clamp(72px, 14vw, 160px) clamp(16px, 4vw, 48px) clamp(56px, 8vw, 96px); max-width: 1200px; margin: 0 auto; }
  .tag {
    display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--silver-hi); border: 1px solid var(--line); padding: 6px 12px; border-radius: 2px; background: var(--panel);
  }
  .hero h1 {
    margin-top: 24px; font-size: clamp(44px, 9vw, 112px); line-height: 0.98; font-weight: 800; letter-spacing: -0.03em; text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 0%, #b8bec8 45%, #6f7580 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { margin-top: 24px; max-width: 620px; font-size: clamp(16px, 2vw, 20px); color: var(--silver-lo); }
  .hero-line { margin-top: 48px; height: 1px; background: linear-gradient(90deg, var(--silver) 0%, transparent 80%); }

  /* SECTIONS */
  .section { max-width: 1200px; margin: 0 auto; padding: clamp(56px, 8vw, 104px) clamp(16px, 4vw, 48px); border-top: 1px solid var(--line); }
  .sec-head { display: flex; gap: clamp(16px, 3vw, 40px); align-items: flex-start; margin-bottom: clamp(32px, 5vw, 56px); }
  .sec-num {
    font-family: var(--mono); font-size: clamp(40px, 7vw, 84px); font-weight: 700; line-height: 1; color: transparent;
    -webkit-text-stroke: 1px var(--silver-lo);
  }
  .sec-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--silver-lo); }
  .sec-title { font-size: clamp(30px, 5vw, 56px); line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; color: var(--silver-hi); margin-top: 6px; }
  .sec-blurb { margin-top: 14px; max-width: 640px; color: var(--silver-lo); font-size: clamp(15px, 1.8vw, 18px); }

  /* FEATURE GRID */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: clamp(16px, 2.5vw, 28px); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; transition: transform .3s, border-color .3s, box-shadow .3s; }
  .card:hover { transform: translateY(-4px); border-color: var(--silver-lo); box-shadow: 0 12px 40px var(--glow); }
  .card-body { padding: 20px 22px 24px; }
  .card h3 { font-size: 18px; color: var(--silver-hi); text-transform: uppercase; letter-spacing: 0.04em; }
  .card p { margin-top: 8px; font-size: 15px; color: var(--silver-lo); }

  /* 16:9 MEDIA */
  .media { position: relative; aspect-ratio: 16 / 9; width: 100%; background: var(--panel-2); overflow: hidden; border-bottom: 1px solid var(--line); }
  .media img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .media .corner { position: absolute; width: 14px; height: 14px; border-color: var(--silver); border-style: solid; opacity: .7; pointer-events: none; }
  .corner.tl { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
  .corner.tr { top: 8px; right: 8px; border-width: 1px 1px 0 0; }
  .corner.bl { bottom: 8px; left: 8px; border-width: 0 0 1px 1px; }
  .corner.br { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }
  .placeholder {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--silver-lo); text-align: center; padding: 12px;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.05), transparent 50%),
      repeating-linear-gradient(45deg, transparent 0 14px, rgba(255,255,255,0.025) 14px 15px);
  }
  .placeholder b { color: var(--silver); font-weight: 600; }

  /* ROADMAP */
  .roadmap { position: relative; display: grid; gap: clamp(16px, 2.5vw, 28px); }
  .step { display: grid; grid-template-columns: 120px 1fr; gap: clamp(16px, 3vw, 36px); align-items: stretch; }
  .step-when { font-family: var(--mono); font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--silver-hi); padding-top: 20px; border-top: 1px solid var(--silver); }
  .step-card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; display: grid; grid-template-columns: 1fr; }
  .step-card.has-media { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }
  .step-card .media { border-bottom: 0; border-left: 1px solid var(--line); order: 2; align-self: center; }
  .step-text { padding: 22px 24px; order: 1; }
  .step-text h3 { font-size: 20px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--silver-hi); }
  .step-text p { margin-top: 8px; color: var(--silver-lo); font-size: 15px; }

  /* FOOTER */
  .footer { max-width: 1200px; margin: 0 auto; padding: 40px clamp(16px, 4vw, 48px) 64px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--silver-lo); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  /* REVEAL */
  .reveal { opacity: 1; transform: none; }
  .js-reveal .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
  .js-reveal .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .js-reveal .reveal { opacity: 1; transform: none; transition: none; }
    .card, .card:hover { transition: none; transform: none; }
  }

  @media (max-width: 760px) {
    .brand { display: none; }
    .nav { justify-content: center; }
    .step { grid-template-columns: 1fr; gap: 10px; }
    .step-card.has-media { grid-template-columns: 1fr; }
    .step-card .media { order: 0; border-left: 0; border-bottom: 1px solid var(--line); }
    .step-text { order: 1; }
  }
</style>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:24px;color:#c9ced6;font-family:sans-serif">This page needs JavaScript enabled.</p></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>

      props.section.items.map(function (it, i) {

  // Add a new kind here, then use it as kind: "..." in SECTIONS.
